<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio CMS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0a0a0a;
            color: #e4e4e7;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        .grain-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 100;
            background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
            opacity: 0.03;
            mix-blend-mode: overlay;
        }

        .grid-bg {
            position: fixed;
            inset: 0;
            z-index: -10;
            background-image:
                linear-gradient(to right, #80808014 1px, transparent 1px),
                linear-gradient(to bottom, #80808014 1px, transparent 1px);
            background-size: 14px 24px;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 256px;
            background: #1a1a1a;
            border-right: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid #2a2a2a;
        }

        .sidebar-header h1 {
            font-weight: 700;
            font-size: 20px;
            letter-spacing: 0.05em;
            color: white;
        }

        .sidebar-header p {
            font-size: 12px;
            color: #a1a1aa;
            margin-top: 4px;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.1em;
        }

        .nav {
            flex: 1;
            padding: 16px;
        }

        .nav-btn {
            width: 100%;
            text-align: left;
            padding: 10px 16px;
            border: none;
            background: transparent;
            color: #e4e4e7;
            cursor: pointer;
            border-radius: 8px;
            margin-bottom: 4px;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .nav-btn:hover {
            background: #252525;
        }

        .nav-btn .icon {
            color: #a1a1aa;
            margin-right: 8px;
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid #2a2a2a;
        }

        .new-btn {
            width: 100%;
            background: white;
            color: #0a0a0a;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .new-btn:hover {
            background: #e4e4e7;
        }

        .content-list {
            width: 384px;
            background: #1a1a1a;
            border-right: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
        }

        .search-box {
            padding: 16px;
            border-bottom: 1px solid #2a2a2a;
        }

        .search-input {
            width: 100%;
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 10px 16px;
            color: #e4e4e7;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
        }

        .search-input:focus {
            outline: none;
            border-color: #a1a1aa;
        }

        .search-input::placeholder {
            color: #a1a1aa;
        }

        .list-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .content-card {
            padding: 16px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 8px;
            transition: all 0.2s;
        }

        .content-card:hover {
            background: #252525;
            border-color: #2a2a2a;
            transform: translateY(-2px);
        }

        .content-card-title {
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .content-card-date {
            font-size: 12px;
            color: #a1a1aa;
            font-family: 'JetBrains Mono', monospace;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        .tag {
            font-size: 12px;
            padding: 2px 8px;
            background: rgba(161, 161, 170, 0.1);
            color: #a1a1aa;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
        }

        .editor-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .editor-header {
            padding: 16px;
            border-bottom: 1px solid #2a2a2a;
            background: rgba(26, 26, 26, 0.5);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .editor-title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .editor-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .btn-primary {
            background: white;
            color: #0a0a0a;
        }

        .btn-primary:hover {
            background: #e4e4e7;
        }

        .btn-secondary {
            background: #252525;
            color: #e4e4e7;
        }

        .btn-secondary:hover {
            background: #2a2a2a;
        }

        .editor-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .metadata-panel {
            width: 320px;
            background: #1a1a1a;
            border-right: 1px solid #2a2a2a;
            padding: 24px;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #a1a1aa;
            margin-bottom: 8px;
        }

        .form-input,
        .form-textarea,
        .form-select {
            width: 100%;
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 10px 16px;
            color: #e4e4e7;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
        }

        .form-input:focus,
        .form-textarea:focus,
        .form-select:focus {
            outline: none;
            border-color: #a1a1aa;
        }

        .form-input::placeholder,
        .form-textarea::placeholder {
            color: rgba(161, 161, 170, 0.5);
        }

        .form-textarea {
            resize: none;
        }

        .editor-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #editor {
            flex: 1;
            background: #0a0a0a;
            padding: 32px;
            border: none;
            color: #e4e4e7;
            font-size: 14px;
            line-height: 1.6;
            font-family: 'JetBrains Mono', monospace;
            resize: none;
        }

        #editor:focus {
            outline: none;
        }

        #previewPane {
            flex: 1;
            background: #1a1a1a;
            padding: 32px;
            overflow-y: auto;
            border-left: 1px solid #2a2a2a;
        }

        #previewPane.hidden {
            display: none;
        }

        #preview {
            color: #e4e4e7;
            line-height: 1.8;
        }

        #preview h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 16px;
            color: white;
        }

        #preview h2 {
            font-size: 22px;
            font-weight: 700;
            margin-top: 24px;
            margin-bottom: 12px;
            color: white;
        }

        #preview h3 {
            font-size: 18px;
            font-weight: 600;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        #preview p {
            margin-bottom: 16px;
        }

        #preview code {
            background: #252525;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
        }

        #preview pre {
            background: #0a0a0a;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin-bottom: 16px;
            border: 1px solid #2a2a2a;
        }

        #preview ul,
        #preview ol {
            margin-bottom: 16px;
            padding-left: 24px;
        }

        #preview li {
            margin-bottom: 8px;
        }

        #preview a {
            color: #60a5fa;
            text-decoration: none;
        }

        #preview a:hover {
            text-decoration: underline;
        }

        .backlink {
            color: #a78bfa;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
        }

        .notification {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            transition: opacity 0.3s, transform 0.3s;
        }

        .notification.success {
            background: white;
            color: #0a0a0a;
            border: 1px solid #2a2a2a;
        }

        .notification.error {
            background: #dc2626;
            color: white;
            border: 1px solid #991b1b;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3a3a3a;
        }
    </style>
</head>

<body>
    <div class="grain-overlay"></div>
    <div class="grid-bg"></div>

    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>ANIKET.INK</h1>
                <p>CMS</p>
            </div>

            <nav class="nav">
                <button class="nav-btn" onclick="switchType('projects')">
                    <span class="icon">📁</span> Projects
                </button>
                <button class="nav-btn" onclick="switchType('garden')">
                    <span class="icon">🌱</span> Garden
                </button>
                <button class="nav-btn" onclick="switchType('research')">
                    <span class="icon">🔬</span> Research
                </button>
            </nav>

            <div class="sidebar-footer">
                <button class="new-btn" onclick="newContent()">+ New Content</button>
            </div>
        </div>

        <div class="content-list">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search content..." onkeyup="searchContent()"
                    class="search-input">
            </div>

            <div id="contentList" class="list-container">
                <div style="text-align: center; color: #a1a1aa; font-size: 14px; padding: 32px 0;">Loading...</div>
            </div>
        </div>

        <div class="editor-area">
            <div class="editor-header">
                <div id="editorTitle" class="editor-title">Select or create content</div>
                <div class="editor-actions">
                    <button class="btn btn-primary" onclick="saveContent()">Save & Commit</button>
                    <button class="btn btn-secondary" onclick="togglePreview()">Preview</button>
                </div>
            </div>

            <div class="editor-content">
                <div id="metadataPanel" class="metadata-panel">
                    <div class="form-group">
                        <label class="form-label">Title</label>
                        <input type="text" id="titleInput" class="form-input">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Description</label>
                        <textarea id="descriptionInput" class="form-textarea" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Date</label>
                        <input type="date" id="dateInput" class="form-input">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Tags <span style="font-size: 12px;">(comma separated)</span></label>
                        <input type="text" id="tagsInput" placeholder="robotics, python, test" class="form-input">
                    </div>
                    <div id="statusField" class="form-group" style="display:none;">
                        <label class="form-label">Status</label>
                        <select id="statusInput" class="form-select">
                            <option>Active</option>
                            <option>Completed</option>
                            <option>Archived</option>
                        </select>
                    </div>
                </div>

                <div class="editor-pane">
                    <textarea id="editor" placeholder="Start writing...

Use [[links]] for backlinks
Use $...$ for inline math: $E = mc^2$
Use $$...$$ for block equations" oninput="updatePreview()"></textarea>
                    <div id="previewPane">
                        <div id="preview"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/app.js"></script>
</body>

</html>
